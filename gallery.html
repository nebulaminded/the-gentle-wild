  <style>

    body {
      margin: 0;
      background: #f7f2ea;
      color: #2f2b2c;
      font-family: 'Inter', sans-serif;
    }

    .nav {
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #211f1f;
    }

    .logo {
      color: white;
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.8rem;
      letter-spacing: .12em;
    }

    .nav-links {
      display: flex;
      gap: 2rem;
    }

    .nav-links a {
      color: white;
      text-decoration: none;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .8rem;
    }

    .gallery-hero {
      padding: 8rem 8% 5rem;
      text-align: center;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(4rem, 8vw, 7rem);
      font-weight: 400;
      margin-bottom: 1rem;
    }

    .intro {
      max-width: 760px;
      margin: 0 auto;
      line-height: 1.9;
      color: #5a5552;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 2rem;
      padding: 0 8% 8rem;
    }

    .gallery-grid img {
      width: 100%;
      display: block;
      object-fit: cover;
      box-shadow: 0 20px 60px rgba(47,43,44,.15);
    }

    .footer {
      padding: 2rem;
      text-align: center;
      background: #211f1f;
      color: rgba(255,255,255,.65);
    }
.footer a {
  color: rgba(255,255,255,.75);
  text-decoration: none;
}

.footer a:hover {
  color: white;
}
    @media (max-width: 850px) {
      .gallery-grid {
        grid-template-columns: 1fr;
      }

      .nav {
  flex-direction: column;
  gap: .75rem;
  padding: 1.25rem 1rem;
  text-align: center;
}
h1 {
  line-height: .95;
}
.nav-links {
  flex-wrap: wrap;
  justify-content: center;
  gap: 1rem;
}
      }
    }

  </style>
</head>
