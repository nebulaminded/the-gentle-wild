
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>The Gentle Wild | Lisa Trexler-Fallon</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      background: #f7f2ea;
      color: #2f2b2c;
      font-family: 'Inter', sans-serif;
    }

    .hero {
      height: 100vh;
      background-image:
        linear-gradient(rgba(0,0,0,.35), rgba(0,0,0,.45)),
        url('assets/artwork/moonlight fox.jpg');

      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .hero-content {
      max-width: 800px;
      color: white;
    }

    h1 {
      font-family: 'Cormorant Garamond', serif;
      font-size: 5rem;
      font-weight: 400;
      letter-spacing: .08em;
      margin-bottom: 1rem;
    }

    .subtitle {
      font-size: 1.2rem;
      line-height: 1.8;
      opacity: .92;
    }

    .button {
      display: inline-block;
      margin-top: 2rem;
      padding: 1rem 2rem;
      border: 1px solid rgba(255,255,255,.6);
      color: white;
      text-decoration: none;
      letter-spacing: .12em;
      text-transform: uppercase;
      font-size: .8rem;
      transition: .3s ease;
    }

    .button:hover {
      background: rgba(255,255,255,.12);
    }
  </style>
</head>

<body>

<nav class="nav">
  <div class="logo">The Gentle Wild</div>

  <div class="nav-links">
    <a href="#">Gallery</a>
    <a href="#">Poetry</a>
    <a href="#">Collections</a>
    <a href="#">About</a>
  </div>
</nav>

<section class="hero">
  <div class="hero-content">

    <h1>The Gentle Wild</h1>

    <p class="subtitle">
      Art and poetry inspired by wilderness,
      tenderness, memory, moonlight,
      and the quiet language of the natural world.
    </p>

    <a href="#" class="button">Enter the Gallery</a>

  </div>
</section>

</body>
</html>
